# web-reui 生产环境 nginx 配置
# 用途：静态托管 dist/（SPA）+ 反向代理 /api 到后端（Spring Boot，context-path=/api，端口 8080）
# 部署方式：Dockerfile 多阶段构建会 COPY 本文件到 /etc/nginx/conf.d/default.conf；
#           裸机部署时可 include 到 nginx.conf（注意替换 upstream 地址）。

server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # 单页应用：所有未命中静态文件的路由回退 index.html（react-router 接管）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带指纹的构建产物（/assets/*）：长缓存 + immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，保证发版后立即拿到新入口
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 后端 API 代理（Sa-Token JWT Bearer，透传 Authorization 头）
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;
        # 文件上传体积上限（与后端 multipart 限制对齐，默认 50m）
        client_max_body_size 50m;
        proxy_read_timeout  60s;
    }

    # 健康检查端点（容器探活/负载均衡用）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # gzip 压缩（文本类资源）
    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1k;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml image/svg+xml;
    gzip_vary         on;
}
